name: One-time Passport Approval Hardening

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Harden passport approval source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/components/PassportScannerModal.tsx")
          text = path.read_text(encoding="utf-8")
          changed = False

          # Remove invented fallback values from production behavior.
          replacements = {
              'setCandidateFirstName("المرشح");': 'setCandidateFirstName("");',
              'setVisualPassportNo("P" + Math.floor(10000000 + Math.random() * 90000000));': 'setVisualPassportNo("");',
              'fName = analysis?.mrz?.givenNames || "المرشح";': 'fName = analysis?.mrz?.givenNames || "";',
              'lName = fName || "المرشح";': 'lName = fName;',
              'const passNo = visualPassportNo.trim() || analysis?.mrz?.passportNumber || "P0000000";': 'const passNo = visualPassportNo.trim() || analysis?.mrz?.passportNumber || "";',
              'const passExp = visualExpiryDate || analysis?.mrz?.expiryDateFormatted || "2030-01-01";': 'const passExp = visualExpiryDate || analysis?.mrz?.expiryDateFormatted || "";',
              'const bDate = visualBirthDate || analysis?.mrz?.birthDateFormatted || "1995-01-01";': 'const bDate = visualBirthDate || analysis?.mrz?.birthDateFormatted || "";',
              'firstName: fName || "المرشح",': 'firstName: fName,',
              'lastName: lName || "المرشح",': 'lastName: lName,'
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed = True

          # Use the existing strict approval guard at the actual approval boundary.
          import_anchor = 'import { compressImage } from "../lib/imageUtils";'
          import_line = 'import { canApprovePassportData } from "../lib/passportApprovalGuard";'
          if import_anchor in text and import_line not in text:
              text = text.replace(import_anchor, import_anchor + "\n" + import_line, 1)
              changed = True

          guard_anchor = '''    const gndr = visualGender || (analysis?.mrz?.gender === "female" ? "female" : "male");
    const cntry = visualNationality || analysis?.mrz?.nationalityName || "المملكة العربية السعودية";

    onApplyData({'''
          guard_block = '''    const gndr = visualGender || (analysis?.mrz?.gender === "female" ? "female" : "male");
    const cntry = visualNationality || analysis?.mrz?.nationalityName || "المملكة العربية السعودية";

    const approval = canApprovePassportData({
      hasVerifiedMrz: Boolean(analysis?.mrz?.checksums?.allValid),
      passportNumber: passNo,
      firstName: fName,
      lastName: lName,
      birthDate: bDate,
      expiryDate: passExp
    });

    if (!approval.allowed) {
      setErrorMessage(approval.reason || "لا يمكن اعتماد بيانات الجواز قبل اكتمال الفحص والمطابقة.");
      return;
    }

    onApplyData({'''
          if guard_anchor in text and 'const approval = canApprovePassportData({' not in text:
              text = text.replace(guard_anchor, guard_block, 1)
              changed = True

          path.write_text(text, encoding="utf-8")
          print("changed=" + str(changed).lower())
          PY

          if grep -RniE 'P\\"? \\+|Math\\.random\\(\\).*passport|P0000000|setCandidateFirstName\\(\\"المرشح\\"\\)' src/components src/lib --include='*.ts' --include='*.tsx' --exclude='*.test.ts' --exclude='*.test.tsx'; then
            echo "❌ Unsafe passport placeholder remains."
            exit 1
          fi

          if git diff --quiet -- src/components/PassportScannerModal.tsx; then
            echo "No source change required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PassportScannerModal.tsx
          git commit -m "fix: require verified passport data before candidate approval"
          git push origin HEAD:main
