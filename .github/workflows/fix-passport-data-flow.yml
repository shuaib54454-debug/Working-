name: Fix Passport Data Flow

on:
  push:
    branches:
      - fix/passport-data-flow

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch passport approval flow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/components/PassportScannerModal.tsx")
          text = path.read_text(encoding="utf-8")

          import_old = 'import { compressImage } from "../lib/imageUtils";'
          import_new = import_old + '\nimport { canApprovePassportData } from "../lib/passportApprovalGuard";'
          if import_old not in text:
              raise SystemExit("PassportScannerModal import anchor not found")
          if 'from "../lib/passportApprovalGuard"' not in text:
              text = text.replace(import_old, import_new, 1)

          old = '''    const gndr = visualGender || (analysis?.mrz?.gender === "female" ? "female" : "male");
    const cntry = visualNationality || analysis?.mrz?.nationalityName || "المملكة العربية السعودية";

    onApplyData({'''
          new = '''    const gndr = visualGender || (analysis?.mrz?.gender === "female" ? "female" : "male");
    const cntry = visualNationality || analysis?.mrz?.nationalityName || "المملكة العربية السعودية";

    // Never report a scan as approved when the MRZ is missing/unverified or
    // the candidate fields are empty/placeholders. Manual review remains possible,
    // but approval must be backed by real passport data.
    const approval = canApprovePassportData({
      hasVerifiedMrz: Boolean(analysis?.mrz?.checksums?.allValid),
      passportNumber: passNo,
      firstName: fName,
      lastName: lName,
      birthDate: bDate,
      expiryDate: passExp
    });

    if (!approval.allowed) {
      setErrorMessage(approval.reason || "لا يمكن اعتماد بيانات الجواز قبل اكتمال الفحص والمطابقة.");
      return;
    }

    onApplyData({'''
          if old not in text:
              raise SystemExit("Passport approval anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PassportScannerModal.tsx
          git commit -m "fix: require verified passport data before approval"
          git push origin HEAD:fix/passport-data-flow
