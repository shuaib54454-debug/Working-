name: Final Passport Hardening

on: push

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Harden production passport approval
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/PassportScannerModal.tsx')
          s = p.read_text(encoding='utf-8')
          imp = 'import { canApprovePassportData } from "../lib/passportApprovalGuard";'
          if imp not in s:
              s = s.replace('import { compressImage } from "../lib/imageUtils";', 'import { compressImage } from "../lib/imageUtils";\n' + imp, 1)
          s = s.replace('fName = analysis?.mrz?.givenNames || "المرشح";', 'fName = analysis?.mrz?.givenNames || "";')
          s = s.replace('const passNo = visualPassportNo.trim() || analysis?.mrz?.passportNumber || "P0000000";', 'const passNo = visualPassportNo.trim() || analysis?.mrz?.passportNumber || "";')
          s = s.replace('const passExp = visualExpiryDate || analysis?.mrz?.expiryDateFormatted || "2030-01-01";', 'const passExp = visualExpiryDate || analysis?.mrz?.expiryDateFormatted || "";')
          s = s.replace('const bDate = visualBirthDate || analysis?.mrz?.birthDateFormatted || "1995-01-01";', 'const bDate = visualBirthDate || analysis?.mrz?.birthDateFormatted || "";')
          s = s.replace('firstName: fName || "المرشح",', 'firstName: fName,')
          s = s.replace('lastName: lName || "المرشح",', 'lastName: lName,')
          if 'const approval = canApprovePassportData({' not in s:
              old = '''    onApplyData({
      firstName: fName,'''
              new = '''    const approval = canApprovePassportData({
      hasVerifiedMrz: Boolean(analysis?.mrz?.checksums?.allValid),
      passportNumber: passNo,
      firstName: fName,
      lastName: lName,
      birthDate: bDate,
      expiryDate: passExp
    });

    if (!approval.allowed) {
      setErrorMessage(approval.reason || "لا يمكن اعتماد بيانات الجواز قبل اكتمال الفحص والمطابقة.");
      return;
    }

    onApplyData({
      firstName: fName,'''
              if old not in s:
                  raise SystemExit('handleApply anchor not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          gpath = Path('src/lib/passportApprovalGuard.ts')
          g = gpath.read_text(encoding='utf-8')
          if 'if (/^p0{7}$/i.test(normalized)) return true;' not in g:
              g = g.replace('  const normalized = value.trim().toLowerCase();', '  const normalized = value.trim().toLowerCase();\n  if (/^p0{7}$/i.test(normalized)) return true;', 1)
          gpath.write_text(g, encoding='utf-8')
          PY

          ! grep -RniE 'P0000000|Math\.random\(\).*passport|setCandidateFirstName\("المرشح"\)' src/components src/lib --include='*.ts' --include='*.tsx' --exclude='*.test.ts' --exclude='*.test.tsx'
          npm ci --legacy-peer-deps
          npm run lint
          npm test
          npm run build:web

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PassportScannerModal.tsx src/lib/passportApprovalGuard.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix: require verified passport data before candidate approval'
            git push origin HEAD:main
          fi
