name: Final Passport Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Harden passport approval path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          scanner = Path('src/components/PassportScannerModal.tsx')
          text = scanner.read_text(encoding='utf-8')

          import_line = 'import { canApprovePassportData } from "../lib/passportApprovalGuard";'
          if import_line not in text:
              anchor = 'import { compressImage } from "../lib/imageUtils";'
              if anchor not in text:
                  raise SystemExit('Missing scanner import anchor')
              text = text.replace(anchor, anchor + '\n' + import_line, 1)

          replacements = {
              'fName = analysis?.mrz?.givenNames || "المرشح";': 'fName = analysis?.mrz?.givenNames || "";',
              'const passNo = visualPassportNo.trim() || analysis?.mrz?.passportNumber || "P0000000";': 'const passNo = visualPassportNo.trim() || analysis?.mrz?.passportNumber || "";',
              'const passExp = visualExpiryDate || analysis?.mrz?.expiryDateFormatted || "2030-01-01";': 'const passExp = visualExpiryDate || analysis?.mrz?.expiryDateFormatted || "";',
              'const bDate = visualBirthDate || analysis?.mrz?.birthDateFormatted || "1995-01-01";': 'const bDate = visualBirthDate || analysis?.mrz?.birthDateFormatted || "";',
              'firstName: fName || "المرشح",': 'firstName: fName,',
              'lastName: lName || "المرشح",': 'lastName: lName,'
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          approval_anchor = '    onApplyData({\n      firstName: fName,'
          approval_block = '''    const approval = canApprovePassportData({
      hasVerifiedMrz: Boolean(analysis?.mrz?.checksums?.allValid),
      passportNumber: passNo,
      firstName: fName,
      lastName: lName,
      birthDate: bDate,
      expiryDate: passExp
    });

    if (!approval.allowed) {
      setErrorMessage(approval.reason || "لا يمكن اعتماد بيانات الجواز قبل اكتمال الفحص والمطابقة.");
      return;
    }

    onApplyData({
      firstName: fName,'''
          if 'const approval = canApprovePassportData({' not in text:
              if approval_anchor not in text:
                  raise SystemExit('Missing scanner approval anchor')
              text = text.replace(approval_anchor, approval_block, 1)

          scanner.write_text(text, encoding='utf-8')

          guard = Path('src/lib/passportApprovalGuard.ts')
          g = guard.read_text(encoding='utf-8')
          g = g.replace('  "p0000000"\n', '')
          marker = 'const isPlaceholder = (value: string) => {'
          if marker not in g:
              raise SystemExit('Missing placeholder function anchor')
          if 'if (/^p0{7}$/i.test(value.trim())) return true;' not in g:
              g = g.replace(marker, marker + '\n  if (/^p0{7}$/i.test(value.trim())) return true;', 1)
          guard.write_text(g, encoding='utf-8')
          PY

          if grep -RniE 'P\\"? \\+|Math\\.random\\(\\).*passport|P0000000|setCandidateFirstName\\(\\"المرشح\\"\\)' src/components src/lib --include='*.ts' --include='*.tsx' --exclude='*.test.ts' --exclude='*.test.tsx'; then
            echo '❌ Unsafe passport placeholder/random fallback remains.'
            exit 1
          fi

          npm ci --legacy-peer-deps
          npm run lint
          npm test
          npm run build:web

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PassportScannerModal.tsx src/lib/passportApprovalGuard.ts
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'fix: require verified passport data before candidate approval'
          git push origin HEAD:main
