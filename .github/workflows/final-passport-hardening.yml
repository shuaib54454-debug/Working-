name: Final Passport Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Harden passport approval path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          scanner = Path('src/components/PassportScannerModal.tsx')
          text = scanner.read_text(encoding='utf-8')

          replacements = {
              'import { compressImage } from "../lib/imageUtils";': 'import { compressImage } from "../lib/imageUtils";\nimport { canApprovePassportData } from "../lib/passportApprovalGuard";',
              'fName = analysis?.mrz?.givenNames || "المرشح";': 'fName = analysis?.mrz?.givenNames || "";',
              'lName = analysis?.mrz?.surname && analysis?.mrz?.surname !== "المرشح" ? analysis?.mrz?.surname : fName;': 'lName = analysis?.mrz?.surname && analysis?.mrz?.surname !== "المرشح" ? analysis?.mrz?.surname : fName;',
              '    onApplyData({\n      firstName: fName,': '    const approval = canApprovePassportData({\n      hasVerifiedMrz: Boolean(analysis?.mrz?.checksums?.allValid),\n      passportNumber: passNo,\n      firstName: fName,\n      lastName: lName,\n      birthDate: bDate,\n      expiryDate: passExp\n    });\n\n    if (!approval.allowed) {\n      setErrorMessage(approval.reason || "لا يمكن اعتماد بيانات الجواز قبل اكتمال الفحص والمطابقة.");\n      return;\n    }\n\n    onApplyData({\n      firstName: fName,'
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected source anchor: {old[:80]}')
              text = text.replace(old, new, 1)

          scanner.write_text(text, encoding='utf-8')

          guard = Path('src/lib/passportApprovalGuard.ts')
          g = guard.read_text(encoding='utf-8')
          old = '  "p0000000"\n'
          if old not in g:
              raise SystemExit('Missing passport placeholder anchor in guard')
          g = g.replace(old, '', 1)
          marker = 'const isPlaceholder = (value: string) => {'
          replacement = 'const isPlaceholder = (value: string) => {\n  if (/^p0{7}$/i.test(value.trim())) return true;'
          if marker not in g:
              raise SystemExit('Missing placeholder function anchor')
          g = g.replace(marker, replacement, 1)
          guard.write_text(g, encoding='utf-8')
          PY

          if grep -RniE 'P\\"? \\+|Math\\.random\\(\\).*passport|P0000000|setCandidateFirstName\\(\\"المرشح\\"\\)' src/components src/lib --include='*.ts' --include='*.tsx' --exclude='*.test.ts' --exclude='*.test.tsx'; then
            echo '❌ Unsafe passport placeholder/random fallback remains.'
            exit 1
          fi

          npm ci
          npm run lint
          npm test
          npm run build:web

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PassportScannerModal.tsx src/lib/passportApprovalGuard.ts
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'fix: require verified passport data before candidate approval'
          git push origin HEAD:main
