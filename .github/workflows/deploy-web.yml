name: 🌐 Deploy Working- Web App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: 🚀 Build and Deploy Web to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🧪 TypeScript check
        run: npm run lint

      - name: 🌐 Build Web Application
        run: npm run build:web

      - name: 🔥 Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT" || {
            echo "❌ FIREBASE_SERVICE_ACCOUNT GitHub secret is not configured."
            echo "Add the Firebase service-account JSON as a GitHub Actions secret, then run this workflow again."
            exit 1
          }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx --yes firebase-tools@latest deploy --only hosting --project crack-petal-506818-c8 --non-interactive

      - name: 🧹 Secure credential cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
