name: "Deploy Working- Web App"

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: "Build and Deploy Web to Firebase Hosting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npm run lint

      - name: Build Web Application
        run: npm run build:web

      - name: Validate Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT" || {
            echo "ERROR: FIREBASE_SERVICE_ACCOUNT is empty or not configured."
            echo "Add the complete Google Cloud service-account JSON as the GitHub Actions secret."
            exit 1
          }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.raw"
          node "$GITHUB_WORKSPACE/scripts/validateFirebaseServiceAccount.mjs" "$RUNNER_TEMP/firebase-service-account.raw" "$RUNNER_TEMP/firebase-service-account.json"

      - name: Authenticate Google Cloud
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-service-account.json" --project=crack-petal-506818-c8
          gcloud config set project crack-petal-506818-c8
          gcloud services enable firebasehosting.googleapis.com --project=crack-petal-506818-c8

      - name: Deploy Firebase Hosting
        run: node scripts/deployFirebaseHosting.mjs

      - name: Verify live deployment
        run: |
          for i in 1 2 3 4 5 6; do
            status=$(curl -L -s -o /tmp/working-home.html -w "%{http_code}" --max-time 20 https://crack-petal-506818-c8.web.app/ || true)
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ] && grep -qi "<html" /tmp/working-home.html; then
              echo "Firebase Hosting is serving the Working- app."
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: Firebase Hosting deployment could not be verified."
          exit 1

      - name: Secure credential cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json" "$RUNNER_TEMP/firebase-service-account.raw"
