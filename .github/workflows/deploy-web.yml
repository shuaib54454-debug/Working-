name: 🌐 Deploy Working- Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    name: 🚀 Build and Deploy Web to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🧪 TypeScript check
        run: npm run lint

      - name: 🌐 Build Web Application
        run: npm run build:web

      - name: 🔥 Provision and Deploy Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT" || {
            echo "❌ FIREBASE_SERVICE_ACCOUNT GitHub secret is not configured."
            exit 1
          }

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"

          echo "🔎 Checking default Firebase Hosting site..."
          if ! npx --yes firebase-tools@latest hosting:sites:list --project crack-petal-506818-c8 --json > /tmp/hosting-sites.json 2>/tmp/hosting-site-error.log || ! grep -q '"name": "projects/crack-petal-506818-c8/sites/crack-petal-506818-c8"' /tmp/hosting-sites.json; then
            echo "⚠️ Default Hosting site is missing. Creating it now..."
            cat /tmp/hosting-site-error.log || true
            npx --yes firebase-tools@latest hosting:sites:create crack-petal-506818-c8 --project crack-petal-506818-c8 --non-interactive
          fi

          echo "🎯 Applying explicit Working- Hosting target..."
          npx --yes firebase-tools@latest target:apply hosting working crack-petal-506818-c8 --project crack-petal-506818-c8

          echo "🚀 Deploying Web app..."
          npx --yes firebase-tools@latest deploy --only hosting:working --project crack-petal-506818-c8 --non-interactive

          echo "🔎 Verifying live deployment..."
          for i in 1 2 3 4 5 6; do
            status=$(curl -L -s -o /tmp/working-home.html -w "%{http_code}" --max-time 20 https://crack-petal-506818-c8.web.app/ || true)
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ] && grep -qi "<html" /tmp/working-home.html; then
              echo "✅ Firebase Hosting is serving the Working- app."
              exit 0
            fi
            sleep 10
          done

          echo "❌ Hosting deployment verification failed."
          head -c 2000 /tmp/working-home.html || true
          gh issue create --title "Web deployment failed" --body "Firebase Hosting deployment verification failed for commit $GITHUB_SHA. Review the workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          exit 1

      - name: 🧹 Secure credential cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
