name: Build & Sign Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء (release أو debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-and-sign:
    name: 🚀 Build & Sign Shuayb Recruitment APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22.x (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🌐 Build Web Application (Vite)
        run: |
          npm run build:web

      - name: 📱 Sync Android Platform (Capacitor)
        run: |
          npx cap sync android
          node scripts/generate-android-assets.cjs

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🛠️ Ensure Clean Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x ./gradlew

      # ----------------- Debug Flow -----------------
      - name: 🔨 Build Debug APK
        if: "${{ github.event.inputs.build_type == 'debug' }}"
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 📤 Upload Debug APK Artifact
        if: "${{ github.event.inputs.build_type == 'debug' }}"
        uses: actions/upload-artifact@v4
        with:
          name: shuayb-recruitment-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ----------------- Release Flow with Keystore Signing -----------------
      - name: 🔐 Setup Keystore & Auto-Sign Configuration
        if: "${{ github.event.inputs.build_type != 'debug' }}"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/shuayb-release-key.jks
            echo "✅ Custom Keystore decoded successfully."
            echo "ANDROID_KEYSTORE_FILE=shuayb-release-key.jks" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "⚡ Generating automatic signing keystore so the APK installs directly on Android..."
            keytool -genkeypair -v -keystore android/app/shuayb-release-key.jks -alias shuayb -keyalg RSA -keysize 2048 -validity 10000 -storepass shuayb123456 -keypass shuayb123456 -dname "CN=Shuayb Agency, OU=Recruitment, O=Shuayb, L=Riyadh, ST=Riyadh, C=SA"
            echo "ANDROID_KEYSTORE_FILE=shuayb-release-key.jks" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=shuayb123456" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=shuayb" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=shuayb123456" >> $GITHUB_ENV
          fi

      - name: 🔨 Assemble Release APK
        if: "${{ github.event.inputs.build_type != 'debug' }}"
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: ✍️ Ensure APK is Signed (Zipalign & apksigner)
        if: "${{ github.event.inputs.build_type != 'debug' }}"
        run: |
          cd android
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          
          # Check if signed APK was produced by gradle
          if [ ! -f "app/build/outputs/apk/release/app-release.apk" ] && [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "Signing app-release-unsigned.apk manually with apksigner..."
            $APKSIGNER sign --ks app/shuayb-release-key.jks --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass "pass:$ANDROID_KEY_PASSWORD" --out app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
          fi

          echo "=========================================="
          echo "Verifying final APK Signature..."
          echo "=========================================="
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            $APKSIGNER verify --verbose app/build/outputs/apk/release/app-release.apk
            echo "🎉 APK is ready and signed for installation: app/build/outputs/apk/release/app-release.apk"
          fi

      - name: 📤 Upload Release APK Artifact
        if: "${{ github.event.inputs.build_type != 'debug' }}"
        uses: actions/upload-artifact@v4
        with:
          name: shuayb-recruitment-app-release
          path: |
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 🧹 Secure Keystore Cleanup
        if: always()
        run: |
          rm -f android/app/shuayb-release-key.jks
          echo "🔒 Keystore secure cleanup completed."
