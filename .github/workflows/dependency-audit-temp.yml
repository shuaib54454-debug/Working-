name: Temporary Dependency Audit

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e 'const x=require("./audit.json"); console.log(JSON.stringify(x.metadata)); for (const [k,v] of Object.entries(x.vulnerabilities||{})) console.log(k, JSON.stringify({severity:v.severity,isDirect:v.isDirect,via:v.via,fixAvailable:v.fixAvailable}));'
