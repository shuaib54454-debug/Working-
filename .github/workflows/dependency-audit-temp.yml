name: Dependency Audit Snapshot

on:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: npm audit JSON
        run: npm audit --json > npm-audit.json || true
      - name: Print audit summary
        run: |
          node - <<'NODE'
          const a = require('./npm-audit.json');
          console.log('TOTAL', JSON.stringify(a.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
            console.log(JSON.stringify({
              name,
              severity: v.severity,
              isDirect: v.isDirect,
              via: Array.isArray(v.via) ? v.via.map(x => typeof x === 'string' ? x : ({source:x.source,name:x.name,severity:x.severity,title:x.title,url:x.url,range:x.range})) : v.via,
              range: v.range,
              fixAvailable: v.fixAvailable
            }));
          }
          NODE
