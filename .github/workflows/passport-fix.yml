name: Passport Approval Hardening

on: [push]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove production passport placeholders
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/givenNames || "المرشح"/givenNames || ""/' src/components/PassportScannerModal.tsx
          sed -i 's/ || "المرشح" ?/ || "" ?/' src/components/PassportScannerModal.tsx || true
          ! grep -RniE 'P0000000|Math\.random\(\).*passport|givenNames \|\| "المرشح"|setCandidateFirstName\("المرشح"\)' src/components src/lib --include='*.ts' --include='*.tsx' --exclude='*.test.ts' --exclude='*.test.tsx'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PassportScannerModal.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix: remove final passport placeholder'
            git push origin HEAD:main
          fi
