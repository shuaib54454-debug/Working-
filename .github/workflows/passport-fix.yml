name: Passport Approval Hardening

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove synthetic passport approval path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/components/PassportScannerModal.tsx")
          text = path.read_text(encoding="utf-8")
          text = text.replace("  generateTD3MRZFromVisual,\n", "")
          text, n = re.subn(r'\n    // If MRZ lines are missing but visual fields exist, auto-synthesize valid MRZ\n    if \(!parsedMRZ && \(candidateFirstName \|\| visualPassportNo\)\) \{.*?\n    \}\n\n    // Auto-fill candidate fields', '\n    // Auto-fill candidate fields', text, flags=re.S)
          if n != 1: raise SystemExit(f"Expected visual MRZ synthesis block, found {n}")
          text, n = re.subn(r'\n          // If MRZ lines are missing or partial, auto-synthesize from visual fields\n          if \(!line1 \|\| !line2 \|\| line1\.length < 40 \|\| line2\.length < 40\) \{.*?\n          \}\n\n          setMrzLine1\(line1\);', '\n          setMrzLine1(line1);', text, flags=re.S)
          if n != 1: raise SystemExit(f"Expected AI MRZ synthesis block, found {n}")
          text, n = re.subn(r'\n  // Auto-generate standard ICAO Doc 9303 MRZ lines from visual fields\n  const handleAutoGenerateMRZ = \(\) => \{.*?\n  \};\n', '\n', text, flags=re.S)
          if n != 1: raise SystemExit(f"Expected auto-generate handler, found {n}")

          start = text.find('  // Apply parsed and verified data to Candidate Form\n  const handleApply = () => {')
          end = text.find('\n  // Copy structured audit report', start)
          if start == -1 or end == -1: raise SystemExit("handleApply anchors not found")
          replacement = '''  // Apply only real, verified passport data to the candidate form.
  const handleApply = () => {
    const mrz = analysis?.mrz;
    const isVerified = Boolean(
      mrz &&
      mrz.checksums.allValid &&
      analysis?.overallStatus === "VERIFIED" &&
      !analysis.validityAnalysis.isExpired
    );
    if (!isVerified) {
      setErrorMessage("لا يمكن اعتماد بيانات الجواز قبل استخراج MRZ حقيقي والتحقق من جميع أرقام التحقق والمطابقة.");
      return;
    }
    const fName = (mrz?.givenNames || candidateFirstName).trim();
    const lName = (mrz?.surname || candidateLastName || fName).trim();
    const passNo = cleanPassportNumber(mrz?.passportNumber || visualPassportNo);
    const passExp = normalizeDateToISO(mrz?.expiryDateFormatted || visualExpiryDate);
    const bDate = normalizeDateToISO(mrz?.birthDateFormatted || visualBirthDate);
    const gndr = mrz?.gender === "female" ? "female" : "male";
    const cntry = mrz?.nationalityName || mrz?.issuingCountryName || visualNationality;
    const approval = canApprovePassportData({
      hasVerifiedMrz: true,
      passportNumber: passNo,
      firstName: fName,
      lastName: lName,
      birthDate: bDate,
      expiryDate: passExp
    });
    if (!approval.allowed || !approval.normalizedData) {
      setErrorMessage(approval.reason || "لا يمكن اعتماد بيانات الجواز قبل اكتمال التحقق.");
      return;
    }
    onApplyData({
      firstName: approval.normalizedData.firstName,
      lastName: approval.normalizedData.lastName,
      passportNumber: approval.normalizedData.passportNumber,
      passportExpiryDate: approval.normalizedData.expiryDate,
      dateOfBirth: approval.normalizedData.birthDate,
      gender: gndr,
      country: cntry,
      job: visualJob || "عاملة منزلية"
    });
    onClose();
  };
'''
          text = text[:start] + replacement + text[end:]
          text, n = re.subn(r'\n              <button\n                type="button"\n                onClick=\{handleAutoGenerateMRZ\}.*?\n              </button>', '', text, flags=re.S)
          if n != 1: raise SystemExit(f"Expected synthetic MRZ UI button, found {n}")
          path.write_text(text, encoding="utf-8")

          guard = Path("src/lib/passportApprovalGuard.ts")
          guard_text = guard.read_text(encoding="utf-8").replace('  if (isExpired && !input.allowExpired) {', '  if (isExpired) {')
          guard.write_text(guard_text, encoding="utf-8")
          PY

          ! grep -RniE 'generateTD3MRZFromVisual|Math\.random\(\).*passport|P0000000|"مرشحة جديدة"|"EP" \+ Math\.floor|allowExpired: true|handleAutoGenerateMRZ' src/components --include='*.ts' --include='*.tsx' --exclude='*.test.ts' --exclude='*.test.tsx'
          ! grep -RniE 'if \(isExpired && !input\.allowExpired\)|allowExpired: true' src/lib src/components --include='*.ts' --include='*.tsx' --exclude='*.test.ts' --exclude='*.test.tsx'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PassportScannerModal.tsx src/lib/passportApprovalGuard.ts
          if ! git diff --cached --quiet; then
            git commit -m 'security: require real verified passport MRZ data'
            git push origin HEAD:${{ github.head_ref }}
          fi
          git rm -f .github/workflows/passport-fix.yml
          git commit -m 'chore: remove one-time passport hardening workflow'
          git push origin HEAD:${{ github.head_ref }}
